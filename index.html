<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World layers</title>
<style>
  :root { --bg: #dfe8ee; --sea: #c9dbe6; --land: #f4f1e8; --ink: #2a3440; --dim: #6b7682; --panel: #ffffffee; --line: #9aa6b2;
          --hi: #e0552b; --hi-fill: #e0552b55; --water-label: #3d6f96; --land-label: #7a5a3a; --field: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11161b; --sea: #16222c; --land: #2a2d2a; --ink: #d9dee3; --dim: #8b949c; --panel: #1b2228ee; --line: #56616b;
          --hi: #ffb347; --hi-fill: #ffb34755; --water-label: #7fb0d6; --land-label: #d0b48e; --field: #11161b; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  canvas#map { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }   /* (the map's own gestures: a pinch zooms the map, not the page) */
  canvas#map.dragging { cursor: grabbing; }
  #panel { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 10px 12px; border-radius: 8px; width: 270px; max-width: calc(100vw - 48px); box-shadow: 0 1px 6px #0003; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #roll { float: right; border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px; }
  #roll:hover { color: var(--ink); }
  /* rolled up: the title, the search, what you clicked and the year -- the layer settings out of the way */
  #panel.rolled > :not(h1, #q, #results, #info, #histbox) { display: none; }
  #panel.rolled h1 { margin-bottom: 2px; }
  #panel label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel select, #q { width: 100%; box-sizing: border-box; margin: 4px 0 8px; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
  #results { list-style: none; margin: -6px 0 8px; padding: 0; max-height: 280px; overflow-y: auto; }
  #results li, #info li { padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #results li span:last-child, #info li span:last-child { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #results li.on, #results li:hover, #info li:hover { background: var(--hi-fill); }
  #info { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; display: none; }
  #info h2 { font-size: 14px; margin: 0; }
  #info .kind { color: var(--dim); font-size: 12px; }
  #info ul { list-style: none; margin: 4px 0 0; padding: 0; }
  #info button { float: right; border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  #stats, #hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  #histbox:not([hidden]) { display: flex; gap: 6px; align-items: center; margin: -4px 0 8px; }
  #histbox input[type=range] { flex: 1; min-width: 0; }
  #histbox input[type=text] { background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; font: inherit; }
  #legend { display: none; font-size: 12px; margin: -4px 0 8px; line-height: 1.5; }
  #legend span { display: inline-block; margin-right: 8px; white-space: nowrap; }
  #legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid #0002; }
  #groups-box { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
  #groups-box summary { cursor: pointer; font-weight: 600; }
  #groups .row { display: flex; align-items: center; gap: 4px; margin: 3px 0; }
  #groups .row input[type=text] { flex: 1; min-width: 0; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; font: inherit; }
  #groups .row input[type=color] { width: 22px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: none; }
  #groups .row .n { color: var(--dim); font-size: 12px; min-width: 18px; text-align: right; }
  #groups .row button, #groups-box .buttons button { border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 4px; cursor: pointer; font: inherit; padding: 0 6px; }
  #groups-box .buttons { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  #groups-box .note { color: var(--dim); font-size: 12px; }
  #version { color: var(--dim); font-size: 12px; margin-top: 4px; }
  #version button, #update-note button { border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 4px; cursor: pointer; font: inherit; padding: 1px 7px; }
  #update-note { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--panel); color: var(--ink); padding: 6px 12px;
                 border-radius: 8px; box-shadow: 0 1px 6px #0003; font: 13px system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  #update-note[hidden] { display: none; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); padding: 4px 8px; border-radius: 5px; display: none; box-shadow: 0 1px 4px #0003; }
  #game-btn { position: fixed; top: 12px; right: 12px; border: 0; background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 8px; box-shadow: 0 1px 6px #0003; cursor: pointer; font: 600 13px system-ui, sans-serif; }
  #game { position: fixed; top: 12px; right: 12px; background: var(--panel); padding: 10px 12px; border-radius: 8px; width: 280px; max-width: calc(100vw - 48px); max-height: calc(100vh - 48px); overflow-y: auto; box-shadow: 0 1px 6px #0003; }
  #game h1 { font-size: 14px; margin: 0 0 6px; }
  #game select, #game input { box-sizing: border-box; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
  #game select, #g-name { width: 100%; margin: 4px 0 6px; }
  #game input[type=number] { width: 72px; padding: 2px 4px; }
  #game label { display: block; margin: 2px 0 6px; }
  #game button { border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 5px; cursor: pointer; font: inherit; padding: 3px 10px; }
  #game #game-close { float: right; border: 0; background: none; color: var(--dim); font-size: 15px; line-height: 1; padding: 0 2px; }
  #g-ask { font-size: 15px; margin: 6px 0; }
  #g-msg { min-height: 1.4em; }
  #g-msg.no { color: var(--hi); }
  #g-score { color: var(--dim); font-size: 12px; margin: 4px 0; }
  #g-list { margin: 4px 0 0; padding-left: 22px; max-height: 40vh; overflow-y: auto; font-size: 12px; }
  #g-list li span { color: var(--dim); }
  body.gaming #q, body.gaming #results, body.gaming #info { display: none; }
  @media (max-width: 700px) { body.gaming #panel { display: none; } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="panel">
  <h1>World layers <button id="roll" aria-expanded="true" aria-keyshortcuts="R" title="Roll the settings up (or down again) -- R">▴</button></h1>
  <select id="proj" aria-label="Projection"></select>
  <select id="mode" aria-label="Map mode"><option value="political">political map</option><option value="geographical">geographical map</option><option value="language">languages</option><option value="density">population density</option><option value="bio">biogeographical (realms, biomes, ecoregions)</option><option value="history">historical borders (3000 BC–2019)</option></select>
  <select id="biolevel" aria-label="Biogeographic level" hidden><option value="realms">realms</option><option value="biomes">biomes</option><option value="ecoregions">ecoregions</option></select>
  <div id="histbox" hidden><input type="range" id="year" min="-2999" max="2019" step="1" aria-label="Year"><input type="text" id="day" size="11" aria-label="Day (1914-06-28, 1914, 700 BC)" title="a day (1914-06-28), a year (1914) or a year BC (700 BC)"></div>
  <div id="legend"></div>
  <select id="palette" aria-label="Country colours"></select>
  <input id="q" type="search" placeholder="Find a country, city, river, sea, mountains…" autocomplete="off" aria-label="Find by name">
  <ul id="results"></ul>
  <label><input type="checkbox" data-layer="land" checked> 1 land, coast, lakes</label>
  <label><input type="checkbox" data-layer="countries" checked> 2 countries, borders</label>
  <label><input type="checkbox" data-layer="regions" checked> 3 states, provinces</label>
  <label><input type="checkbox" data-layer="rivers" checked> 4 rivers (50 m+ wide, 50 km+)</label>
  <label><input type="checkbox" data-layer="monuments" checked> 5 monuments (100k+ visitors, or well known)</label>
  <label><input type="checkbox" data-layer="cities" checked> 6 cities (100k+ people)</label>
  <label><input type="checkbox" data-layer="areas" checked> 7 seas, mountains, peninsulas… (names)</label>
  <label><input type="checkbox" data-layer="nature" checked> 8 peaks, capes, waterfalls</label>
  <label><input type="checkbox" data-layer="airports" checked> 9 international airports</label>
  <label><input type="checkbox" data-layer="motorways" checked> 10 motorways</label>
  <label><input type="checkbox" data-layer="railways" checked> 11 main railways</label>
  <label><input type="checkbox" data-layer="pipelines"> 12 oil and gas pipelines</label>
  <label><input type="checkbox" data-layer="events" checked> 15 historical events (the historical map)</label>
  <details id="groups-box"><summary>My groups</summary>
    <label><input type="checkbox" id="grouping"> a click puts it into the chosen group</label>
    <div class="note" id="groups-note"></div>
    <div id="groups"></div>
    <div class="buttons"><button id="add-group">+ group</button><button id="link-groups" title="A link to this map with these groups">copy link</button><button id="clear-groups">clear all</button></div>
  </details>
  <div id="info"></div>
  <div id="stats">loading…</div>
  <div id="hint"></div>
  <div id="version"><span id="version-text"></span> <button id="checkUpdate" hidden>check for update</button> <button id="doUpdate" hidden></button></div>
</div>
<div id="update-note" hidden><span id="update-text"></span> <button id="noteUpdate">update now</button></div>
<div id="tip"></div>
<button id="game-btn" title="Name cities, or find them on the map">Game</button>
<div id="game" hidden>
  <button id="game-close" title="End the game: the map as it was">×</button>
  <h1>Cities game</h1>
  <select id="g-where" aria-label="Where"></select>
  <select id="g-style" aria-label="The game">
    <option value="people">Name cities: their people, as a share of all</option>
    <option value="outside">Name cities, each outside every circle so far</option>
    <option value="inside">Name cities, each inside a circle so far</option>
    <option value="place">Find the city: click where it is</option>
  </select>
  <label id="g-kmbox">circles <input id="g-km" type="number" min="10" max="5000" step="10" value="500"> km across</label>
  <label id="g-roundsbox"><input id="g-rounds" type="number" min="1" max="100" value="10"> cities to find</label>
  <button id="g-start">Start</button>
  <div id="g-ask"></div>
  <input id="g-name" type="text" placeholder="a city, then Enter" autocomplete="off" aria-label="A city's name" hidden>
  <div id="g-msg"></div>
  <div id="g-score"></div>
  <ol id="g-list"></ol>
</div>
<!-- the libraries kept here (lib/: d3 7.9.0, d3-geo-projection 4.0.0, topojson-client 3.1.0, topojson-simplify 3.0.3, rbush 3.0.1),
     so the offline copy (sw.js) has them -->
<script src="lib/d3.min.js"></script>
<script src="lib/d3-geo-projection.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/topojson-simplify.min.js"></script>
<script src="lib/rbush.min.js"></script>
<script>
// A look at data/: every layer in any d3 projection. The layers are longitude/latitude with edges meant as the
// shortest way over the globe, so each projection draws them as they are -- nothing here is pre-projected.
// Speed: each layer's pieces sit in an R-tree by their bounding boxes and only the ones in view are drawn; the lines
// come in levels of detail (topojson-simplify: a point is dropped when the triangle it makes is smaller than the
// level's area) and each view uses the coarsest level still finer than a pixel; while the wheel turns, the last
// picture is only scaled, and the map is drawn again once it stops.
const $ = (id) => document.getElementById(id);
const PROJ = {
  "Equal Earth": () => d3.geoEqualEarth(), "Natural Earth": () => d3.geoNaturalEarth1(), "Robinson": () => d3.geoRobinson(),
  "Orthographic (globe)": () => d3.geoOrthographic().clipAngle(90), "Mercator": () => d3.geoMercator(),
  "Equirectangular": () => d3.geoEquirectangular(), "Azimuthal equal-area": () => d3.geoAzimuthalEqualArea().clipAngle(179.9),
  "Winkel tripel": () => d3.geoWinkel3(), "Mollweide": () => d3.geoMollweide(),
};
for (const k of Object.keys(PROJ)) $("proj").add(new Option(k, k));
// the countries' colours: each has a class (`color`, 0-6, no two neighbours the same -- build/write.py), and a
// palette gives each class its colour. Light ones for the light scheme, dark ones for the dark; "none" is the plain land.
const PALETTES = {
  "pastel": ["#f3d9c4", "#d6e6c3", "#cfdcec", "#f4e3a8", "#e6d3e8", "#c9e5e0", "#f0cfd2", "#e2dcc8"],
  "light": ["#f7e8dc", "#e8f0dd", "#e3ebf4", "#f8f0d0", "#f0e6f1", "#e0f0ed", "#f6e3e5", "#eeeae0"],
  "muted": ["#d9b99b", "#b5c9a0", "#a9bfd3", "#ddca8a", "#c8b3cc", "#a4cdc5", "#d6afb3", "#c6bfa8"],
  "vivid": ["#f5a66a", "#9bcf6e", "#7cb0e6", "#f2d75c", "#c99be0", "#6fcfc0", "#f08c9a", "#c2b56f"],
  "dark muted": ["#5a4634", "#3e4d32", "#33424f", "#5a5230", "#4b3a4f", "#2f4a45", "#553a3e", "#45423a"],
  "dark vivid": ["#7d4a1e", "#3f5f1f", "#1f4a73", "#736318", "#5b2f6e", "#1a5f58", "#742c39", "#5b5320"],
  "earth": ["#c9a97a", "#a3ad7c", "#9fb3a8", "#d1b98c", "#b39b84", "#8fa98f", "#c5a08e", "#b7b08f"],
  "greys": ["#e8e8e8", "#d4d4d4", "#dedad4", "#cfd3d6", "#e0dcd8", "#d8dcd2", "#e3e0e6", "#cdcdcd"],
  "none": null,
};
for (const k of Object.keys(PALETTES)) $("palette").add(new Option(k === "none" ? "no country colours" : k + " colours", k));
const palette = () => PALETTES[$("palette").value];
// the states on the political map: each in its country's colour made a little lighter or darker (no two neighbouring
// states of one country alike), so countries differ by hue and the states within one only by shade
const SHADES = [0, -5, 5, -10, 10, -15];                        // (steps of Lab lightness; 0: the country's own colour)
let regionShade = null, shadeCache = new Map();
function regionShades() {                                       // each state's shade: greedy, the most neighbours first
  if (regionShade) return regionShade;
  const R = src.world.objects.regions.geometries, nb = topojson.neighbors(R), cc = (i) => R[i].properties.country;
  regionShade = new Int8Array(R.length).fill(-1);
  for (const i of R.map((_, i) => i).sort((a, b) => nb[b].length - nb[a].length)) {
    const used = new Set(nb[i].filter((j) => cc(j) === cc(i)).map((j) => regionShade[j]));
    let k = 0; while (used.has(k) && k < SHADES.length - 1) k++;
    regionShade[i] = k;
  }
  return regionShade;
}
function shade(color, k) {                                      // (a colour near white or black: all the steps moved in)
  const key = color + k;
  if (!shadeCache.has(key)) {
    const c = d3.lab(color), shift = Math.min(0, 97 - c.l - Math.max(...SHADES)) + Math.max(0, 12 - c.l - Math.min(...SHADES));
    c.l += SHADES[k] + shift; shadeCache.set(key, c.formatHex());
  }
  return shadeCache.get(key);
}
// the two maps: POLITICAL -- countries coloured, their borders and their states' -- and GEOGRAPHICAL -- the seas,
// gulfs, mountains, deserts, plateaus, plains... coloured by their kind (the bigger under the smaller). The natural
// lines -- coast, islands, lakes -- and everything else are on both.
const GEO = {
  ocean: "#c4d9e9", sea: "#bcd3e5", gulf: "#b3cde1", bay: "#b3cde1", sound: "#b3cde1", channel: "#b3cde1", strait: "#b3cde1", fjord: "#b3cde1",
  inlet: "#b3cde1", lagoon: "#aed0d8", estuary: "#b3cde1", reef: "#a9d3cf", lake: "#bcd3e5",
  mountains: "#c9b199", foothills: "#d7c6b0", plateau: "#dbcaa5", desert: "#f0dba8", plain: "#dbe6c0", lowland: "#dbe6c0", basin: "#e0e4c6",
  valley: "#cfdcb8", gorge: "#cfdcb8", delta: "#bfdac4", wetlands: "#bfdac4", tundra: "#e0e7dc", depression: "#e7d8be",
};  // (not: a peninsula, an isthmus, an island, a continent, a coast, a region -- land of no one colour)
const geographical = () => $("mode").value === "geographical";
const mode = () => $("mode").value;
// LANGUAGES: each country and state by its (first official) language -- the widest-spoken ones (by the people of
// the places that have them) in distinct colours, the rest in one grey. DENSITY: people per km2, a sequential scale.
const LANG_COLOURS = ["#e8a06a", "#8fc27a", "#7fb0e6", "#f2d264", "#c69be0", "#6fcfc0", "#f0919c", "#c9b96f", "#a4d47a", "#d9a8d0",
                      "#8ed3e8", "#f5b98a", "#b4b4e8", "#e0c89a", "#9ad6a8", "#e6a5b8", "#c7d47a", "#a8c8e0"];
const DENSITY = [[1, "#f5f1e6"], [5, "#f0e3c0"], [20, "#ecd19c"], [50, "#e6b87c"], [100, "#dd9a62"], [250, "#cf7a4e"], [500, "#b95a3f"], [1000, "#963f34"], [Infinity, "#6b2a2a"]];
const densityColour = (d) => (DENSITY.find(([lim]) => d < lim) || DENSITY[DENSITY.length - 1])[1];
// BIOGEOGRAPHICAL: the land by realm, biome or ecoregion (data/lite/bio.txt, build/bio.py: RESOLVE Ecoregions 2017) --
// a biome and an ecoregion in RESOLVE's own colours, a realm in one of these
const REALM_COLOURS = { PA: "#e9c77b", NA: "#9cc5a1", NT: "#8fd18a", AT: "#f2a65e", IM: "#e58f8f", AA: "#d8a0d6", OC: "#7fc4e0", AN: "#d9e2ea" };
const bioLayer = () => $("biolevel").value;
let langColour = {};
function rankLanguages() {                                         // (the language colours: by the people speaking them, from the data)
  const people = {};
  for (const f of level(0).countries) { const p = f.properties; if (p.language) people[p.language] = (people[p.language] || 0) + (p.population || 1e5); }
  const order = Object.keys(people).sort((a, b) => people[b] - people[a]);
  langColour = {};
  order.forEach((l, i) => { langColour[l] = i < LANG_COLOURS.length ? LANG_COLOURS[i] : "#d8d8d8"; });
  return order;
}
function legend() {
  const el = $("legend"), m = mode();
  el.style.display = (m === "language" || m === "density" || m === "history" || (m === "bio" && bioLayer() !== "ecoregions" && src && src.bio)) ? "block" : "none";
  el.innerHTML = "";
  if (m === "language") {
    const order = rankLanguages();
    for (const l of order.slice(0, LANG_COLOURS.length)) el.append(Object.assign(document.createElement("span"), { innerHTML: `<i style="background:${langColour[l]}"></i>${l}` }));
    el.append(Object.assign(document.createElement("span"), { innerHTML: `<i style="background:#d8d8d8"></i>other` }));
  } else if (m === "density") {
    let lo = 0;
    for (const [lim, c] of DENSITY) { el.append(Object.assign(document.createElement("span"), { innerHTML: `<i style="background:${c}"></i>${lim === Infinity ? lo + "+" : lo + "–" + lim}` })); lo = lim; }
    el.append(Object.assign(document.createElement("span"), { textContent: "people per km²" }));
  } else if (m === "bio" && src && src.bio) {
    for (const f of bioLevel(0)[bioLayer()]) { const p = f.properties; el.append(Object.assign(document.createElement("span"), { innerHTML: `<i style="background:${bioColour(p)}"></i>${p.name}` })); }
  } else if (m === "history") {
    el.append(Object.assign(document.createElement("div"), { textContent: "a dependency: paler, in its ruler's colour · a people or culture (no state): pale, its name grey · a blurred border: approximate (all before 1650) · dashed: to land no state held · ◆ events within a few years (the further back, the more)" }));
  }
}
const bioColour = (p) => REALM_COLOURS[p.id] || p.color || "#d8d8d8";
// the panel rolled up or down (kept between visits)
const roll = (up) => { $("panel").classList.toggle("rolled", up); $("roll").textContent = up ? "▾" : "▴"; $("roll").setAttribute("aria-expanded", String(!up)); try { localStorage["map:rolled"] = up ? "1" : ""; } catch (e) { } };
$("roll").onclick = () => roll(!$("panel").classList.contains("rolled"));
// R rolls it too -- anywhere but in a field you type or choose in
document.addEventListener("keydown", (ev) => {
  if (ev.key.toLowerCase() !== "r" || ev.ctrlKey || ev.metaKey || ev.altKey || ev.target.closest?.("input, select, textarea, [contenteditable]")) return;
  roll(!$("panel").classList.contains("rolled")); ev.preventDefault();
});
try { if (localStorage["map:rolled"]) roll(true); } catch (e) { }
try { if ($("mode").querySelector(`[value="${localStorage.mode}"]`)) $("mode").value = localStorage.mode; } catch (e) { }
const canvas = $("map"), ctx = canvas.getContext("2d");
const snap = document.createElement("canvas");                  // (the last picture, scaled while the wheel turns)
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const R_KM = 6371, WEIGHTS = [0, 3e-9, 3e-8, 3e-7, 3e-6, 3e-5]; // (level i drops points of triangles under WEIGHTS[i] sr: ~0.35, 1.1, 3.5, 11, 35 km)
let W, H, dpr, proj, path, rotate = [-10, 0, 0], zoom = 1, src = null, lod = [], trees = {}, points = {}, index = [], sel = null;
const on = (k) => document.querySelector(`[data-layer="${k}"]`).checked;
const HOW = matchMedia("(pointer: coarse)").matches ? "drag to turn, pinch to zoom, tap to see what is there" : "drag to turn, wheel to zoom, click to see what is there";   // (a phone's fingers, or a mouse)
$("hint").textContent = HOW;
const MAX_ZOOM = 300;   // (about 100 m a pixel on a 1400 px screen: the coast is kept to 100 m, lines to 0.5 km)
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;

  if (sel && (sel.cat === "river" || sel.cat === "line")) { ctx.beginPath(); path(sel.geom); ctx.strokeStyle = css("--hi"); ctx.lineWidth = 2.5; ctx.stroke(); }
  if (G && !fast) keepGameBase();                                // (the map under the game: a guess repaints only what lies on it)
  if (G) drawGame(fast);
  if (fast) return;
  const placed = [];                                            // (labels placed so far: a label that would overlap one is left out)
  if (G) return cityLabels(placed, game.shown(), true);
  if (B) bioLabels(placed);
  if (Hl) histLabels(placed);
  if ((political || themed) && on("countries")) unitLabels(placed);
  if (on("areas")) areaLabels(placed);
  if (on("cities") && src.cities) {
    const ids = query(points.cities, boxes);
    cityDots(ids.filter((i) => src.cities.features[i].properties.population >= minPop()));
    cityLabels(placed, ids);
  }
  if (on("monuments") && src.monuments) {
    ctx.fillStyle = dk ? "#9be07a" : "#2e7d32";
    for (const i of query(points.monuments, boxes)) {
      const f = src.monuments.features[i];
      if (i >= 60 * zoom * zoom || !visible(f.geometry.coordinates)) continue;     // (the file is sorted: the best known first)
      const [x, y] = proj(f.geometry.coordinates);

// the selection: an area of the map's own lines (a sea is water only, a range land only), a country, a lake -- filled
function highlight(s) {

  ctx.beginPath(); path(s.geom); ctx.fillStyle = css("--hi-fill"); ctx.fill();
  ctx.strokeStyle = css("--hi"); ctx.lineWidth = 1.4; ctx.stroke();
}

// the selection's name (and a ring round a point)
function mark(s) {

  const [x, y] = p;
  if (s.cat === "point") { ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.strokeStyle = css("--hi"); ctx.lineWidth = 2; ctx.stroke(); }
  ctx.font = "600 13px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3.5; ctx.strokeStyle = css("--bg"); ctx.fillStyle = css("--ink");
  const ty = s.cat === "point" ? y - 16 : y;
  ctx.strokeText(s.name, x, ty); ctx.fillText(s.name, x, ty);
}

function place(boxes, x, y, w, h) {
  const b = [x - w / 2 - 2, y - h / 2 - 1, x + w / 2 + 2, y + h / 2 + 1];
  if (b[0] < 0 || b[1] < 0 || b[2] > W || b[3] > H) return false;
  for (const o of boxes) if (b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]) return false;
  boxes.push(b); return true;
}

// a name centred on its place, with a halo -- unless it would overlap a name placed before. `spacing`: px between the
// letters (a country's spaced capitals); `alpha`: how far it has faded in (fadeIn)
function writeName(boxes, text, at, size, font, fill, { spacing = 0, alpha = 1 } = {}) {
  if (alpha < 0.15) return;                                         // (too faint to read: it takes no room from another)
  ctx.font = `${font} ${size}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.letterSpacing = `${spacing}px`;
  const [x, y] = proj(at), w = ctx.measureText(text).width;
  if (place(boxes, x, y, w, size)) {
    ctx.lineWidth = 3; ctx.strokeStyle = dark() ? "#000000aa" : "#ffffffcc"; ctx.fillStyle = fill; ctx.globalAlpha = alpha;
    ctx.strokeText(text, x, y); ctx.fillText(text, x, y); ctx.globalAlpha = 1;
  }
  ctx.letterSpacing = "0px";
}
// THE NAMES' HIERARCHY: a country (or a state of its day) in SPACED CAPITALS, the states and provinces within one in
// mixed case, smaller -- and these FADE IN as you come closer (from the zoom where they first fit, full a step on: area
// over the shown minimum, 1 to 2), so they never crowd the countries' names
const SPACED = (size) => size * 0.16, caps = (s) => s.toLocaleUpperCase();
const fadeIn = (area, min) => Math.min(1, Math.max(0, area / min - 1));

// the realms' names, or the ecoregions' (the big ones first, more of them the closer in)
function bioLabels(boxes) {
  const bl = bioLayer(), F = bioLevel(0)[bl === "biomes" ? "realms" : bl];
  if (bl === "biomes") return;                                      // (a biome is everywhere in pieces: its colour says it, the legend names it)
  const min = bl === "realms" ? 0 : 4e6 / (zoom * zoom);
  for (const f of [...F].sort((a, b) => (b.properties.area_km2 || 0) - (a.properties.area_km2 || 0))) {
    const p = f.properties;
    if (!p.label || (p.area_km2 || Infinity) < min || !visible(p.label) || (sel && sel.feats.includes(f))) continue;
    if (bl === "realms") writeName(boxes, caps(p.name), p.label, 14, 600, css("--ink"), { spacing: SPACED(14) }); else writeName(boxes, p.name, p.label, 11, 400, css("--ink"));
  }
}

// the day's states' names (the biggest first, more of them the closer in): a state's in spaced capitals; then a
// culture's, grey; then -- with layer 3 -- the provinces' and dependencies' within a state (an owner's: the Duchy of
// Swabia in the Empire, a colony), smaller, in italics, fading in from closer in
function histLabels(boxes) {
  const P = H0.periods, min = 3e6 / (zoom * zoom), area = (i) => P[i].area_km2 || 0;
  const all = [...histOn().countries].sort((a, b) => area(b) - area(a)), ok = (i) => P[i].label && visible(P[i].label) && !(sel && sel.period === i);
  for (const i of all) { const p = P[i];
    if (p.owner == null && p.status !== "culture" && area(i) >= min && ok(i)) writeName(boxes, caps(p.name), p.label, 11, 600, css("--ink"), { spacing: SPACED(11) }); }
  for (const i of all) { const p = P[i];
    if (p.owner == null && p.status === "culture" && area(i) >= min && ok(i)) writeName(boxes, p.name, p.label, 10, "italic 400", css("--dim")); }
  if (on("regions")) for (const i of all) { const p = P[i], m = STATE_KM2 / (zoom * zoom);
    if (p.owner != null && area(i) >= m && ok(i)) writeName(boxes, p.name, p.label, 10, "italic 400", css("--ink"), { alpha: fadeIn(area(i), m) }); }
}

// the countries' names in spaced capitals, then their states' (with layer 3) in mixed case, fading in: the biggest
// first, more of them the closer in
function unitLabels(boxes) {
  const L = level(0), by = (a, b) => (b.properties.area_km2 || 0) - (a.properties.area_km2 || 0);
  const write = (F, min, size, font, fill, up) => { for (const f of F) { const p = f.properties;
    if (p.label && (p.area_km2 || 0) >= min && visible(p.label) && !(sel && sel.feats.includes(f)))
      writeName(boxes, up ? caps(p.name) : p.name, p.label, size, font, fill, up ? { spacing: SPACED(size) } : { alpha: fadeIn(p.area_km2 || 0, min) }); } };
  write(unitsBySize.countries ??= [...L.countries].sort(by), 6e5 / (zoom * zoom), 11, 600, css("--ink"), true);
  if (on("regions")) write(unitsBySize.regions ??= [...L.regions].sort(by), STATE_KM2 / (zoom * zoom), 11, 400, css("--ink"), false);   // (upright, full ink: a grey italic was lost on the fills)
}
const unitsBySize = {};

// the areas' names: the biggest first, more of them the closer in
function areaLabels(boxes) {
  const dk = dark(), maxRank = Math.log2(zoom) * 1.6 + 1.2, A = level(0).areas;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const f of A) {
    const p = f.properties;
    if ((p.rank ?? 9) > maxRank || !p.label || !visible(p.label) || (sel && sel.feats.includes(f))) continue;
    const water = p.mask === "water", big = p.kind === "ocean" || p.kind === "continent";
    const size = big ? 14 : p.rank <= 1 ? 12 : 11;
    ctx.font = `italic ${big ? 600 : 400} ${size}px Georgia, serif`;
    const text = big ? p.name.toUpperCase() : p.name;
    const [x, y] = proj(p.label), w = ctx.measureText(text).width;
    if (!place(boxes, x, y, w, size)) continue;
    ctx.lineWidth = 3; ctx.strokeStyle = water ? css("--sea") : css("--land");
    ctx.fillStyle = water ? css("--water-label") : css("--land-label");
    ctx.globalAlpha = dk ? 0.9 : 0.85; ctx.strokeText(text, x, y); ctx.fillText(text, x, y); ctx.globalAlpha = 1;
  }

// the cities' dots: the bigger, the larger
function cityDots(ids) {
  ctx.fillStyle = dark() ? "#e8c46a" : "#b03a2e";
  for (const i of ids) {
    const f = src.cities.features[i];
    if (!visible(f.geometry.coordinates)) continue;
    const [x, y] = proj(f.geometry.coordinates), r = 0.8 + Math.sqrt(f.properties.population / 1e6) * 1.6;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }

// the cities' names: the big ones, more the closer in (all: every one given, where it does not overlap another)
function cityLabels(boxes, ids, all = false) {
  const min = all ? 0 : 8e6 / (zoom * zoom);
  ctx.font = "11px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = css("--land"); ctx.fillStyle = css("--ink");
  for (const i of ids) {                                          // (the cities are sorted biggest first)
    const f = src.cities.features[i], p = f.properties;
    if (p.population < min && p.capital !== "country") continue;
    if (p.capital === "country" && p.population < min / 8) continue;
    if (!visible(f.geometry.coordinates)) continue;
    const [x, y] = proj(f.geometry.coordinates), t = p.name, w = ctx.measureText(t).width;
    if (!place(boxes, x + 5 + w / 2, y, w, 11)) continue;

// the points drawn at this zoom: fewer the farther out (all of them from zoom 8)
const minPop = () => zoom >= 8 ? 0 : 5e6 / (zoom * zoom);

// (a point on the far side of the globe is not drawn)
const visible = (p) => { const c = proj.clipAngle && proj.clipAngle(); return !c || d3.geoDistance(p, [-rotate[0], -rotate[1]]) < c * Math.PI / 180; };

// ---- loading, and the index of names -------------------------------------------------------------------------------
// ---- the offline copy and the prepared data ------------------------------------------------------------------------
// THE OFFLINE COPY (sw.js; offline.json -- build/offline.py -- lists the files and their version): on a real site the
// service worker keeps every file the map loads, so it opens with no network and downloads nothing again. It does not
// update on its own: once a visit the page asks for the version online, and a newer one shows a line at the top with
// its Update -- the version kept and a check are also at the panel's foot. Updating replaces only the kept files (and,
// with them, the prepared data below); the groups, the mode and the other settings stay.
const OFFLINE = "map-";
async function startOffline() {   // -> the version kept ("" while the first copy is being made, null with no worker)
  if (!/^https?:$/.test(location.protocol) || !("serviceWorker" in navigator) || !("caches" in self)) return null;
  try { await navigator.serviceWorker.register("sw.js"); } catch (e) { console.warn("map: no offline copy --", e); return null; }
  navigator.storage?.persist?.();   // (asks the browser not to clear the copy when space runs short)
  const keys = (await caches.keys()).filter((k) => k.startsWith(OFFLINE));
  return keys.length ? keys[keys.length - 1].slice(OFFLINE.length) : "";
}
const onlineVersion = async () => { try { return (await (await fetch("offline.json?" + Date.now(), { cache: "no-store" })).json()).version; } catch { return null; } };
async function updateOffline() {   // every file of the online version into its own cache; the old one dropped only once the new one is whole
  const manifest = await (await fetch("offline.json?" + Date.now(), { cache: "no-store" })).json();
  const name = OFFLINE + manifest.version, cache = await caches.open(name);
  try { await cache.addAll(manifest.files.map((f) => new Request(f, { cache: "reload" }))); }
  catch (e) { await caches.delete(name); throw e; }
  for (const k of await caches.keys()) if (k.startsWith(OFFLINE) && k !== name) await caches.delete(k);
  location.reload();
}
function showVersion(kept) {
  if (kept === null) return;
  const here = kept ? `offline copy ${kept}` : "making the offline copy…";
  $("version-text").textContent = here; $("checkUpdate").hidden = false;
  const run = async (button) => {
    for (const b of [$("doUpdate"), $("noteUpdate")]) { b.disabled = true; b.textContent = "updating…"; }
    try { await updateOffline(); } catch (e) { for (const b of [$("doUpdate"), $("noteUpdate")]) { b.disabled = false; b.textContent = "update failed — try again" + (b === button && e?.message ? ` · ${e.message}` : ""); } }
  };
  const ask = async (quiet) => {
    $("checkUpdate").disabled = true;
    const online = await onlineVersion();
    $("checkUpdate").disabled = false;
    if (online && kept && online !== kept) {
      $("version-text").textContent = `${here} · new: ${online}`;
      Object.assign($("doUpdate"), { hidden: false, textContent: "update now", onclick: () => run($("doUpdate")) });
      $("update-text").textContent = `A new version of the map is ready (${online}) — your groups and settings stay.`;
      $("noteUpdate").onclick = () => run($("noteUpdate")); $("update-note").hidden = false;
    } else if (!quiet) $("version-text").textContent = `${here} · ${online === null ? "no network: nothing to check" : "the newest"}`;
  };
  $("checkUpdate").onclick = () => ask(false);
  if (kept) ask(true);
}
// THE PREPARED DATA (IndexedDB "map", store "prepared"): what the page makes of the files before it can draw -- each
// line layer read and presimplified (its points' weights for the coarser levels), the R-trees of the layers' bounds --
// kept under the offline copy's version, so a later visit reads them back instead of making them again (measured on a
// desktop: the world's 1.4 s of reading and presimplifying became 0.4 s). A new version makes them afresh and drops the
// old ones. Without an offline copy (a file:// page, a first visit) everything is made as before.
const PREP = { db: null, version: "" };
async function openPrepared(version) {
  if (!version || !("indexedDB" in self)) return;
  try {
    PREP.db = await new Promise((ok, no) => { const r = indexedDB.open("map", 2); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("prepared")) r.result.createObjectStore("prepared"); }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    PREP.version = version;
    const t = PREP.db.transaction("prepared", "readwrite"), store = t.objectStore("prepared");   // (another version's: gone)
    store.openKeyCursor().onsuccess = (ev) => { const c = ev.target.result; if (!c) return; if (!String(c.key).startsWith(version + "/")) store.delete(c.key); c.continue(); };
  } catch (e) { PREP.db = null; }
}
async function prepared(key, make) {
  if (PREP.db) {
    const hit = await new Promise((ok) => { try { const r = PREP.db.transaction("prepared").objectStore("prepared").get(`${PREP.version}/${key}`); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); } catch { ok(undefined); } });
    if (hit !== undefined) return hit;
  }
  const value = await make();
  if (PREP.db && value != null) { try { PREP.db.transaction("prepared", "readwrite").objectStore("prepared").put(value, `${PREP.version}/${key}`); } catch (e) { } }   // (cloned now: later changes to it are not kept)
  return value;
}
// a line layer as the page uses it: read, and presimplified -- the one topology both the full detail and the coarser
// levels are drawn from (presimplify's copy has the points' weights as a third value, which drawing ignores)
const lineLayer = (name) => prepared(name, async () => { const t = await getData(`lite/${name}.txt`); return t && topojson.presimplify(t, topojson.sphericalTriangleArea); });
// R-trees of the full-detail features' bounds (tree()), kept as rbush's own JSON
async function treesOf(key, feats) {
  const json = await prepared(key, () => Object.fromEntries(Object.entries(feats).map(([k, f]) => [k, tree(f).toJSON()])));
  for (const [k, j] of Object.entries(json)) trees[k] = new RBush().fromJSON(j);
}

// THE DATA: the light files of the line layers (data/lite/*.txt, build/lite.py) and the point layers' CSV -- the only data
// the map loads (the full-detail layers, full/*.topo.json, are what the light files are made from: not served)
const getData = async (f) => { try { const r = await fetch("data/" + f); return !r.ok ? null : f.endsWith(".csv") ? pointsOf(d3.csvParse(await r.text())) : parseLite(await r.text()); } catch { return null; } };
async function load() {

  showVersion(kept);
  const [world, rivers, transport, cities, monuments, nature, airports, events] = await Promise.all([
    lineLayer("world"), lineLayer("rivers"), lineLayer("transport"),
    ...["cities.csv", "monuments.csv", "natural_points.csv", "airports.csv", "events.csv"].map(getData)]);
  if (!world) { $("stats").textContent = "no data/lite/world.txt yet (README.md)"; return; }
  src = { world, rivers, cities, monuments, nature, airports, transport, events, worldPre: world, riversPre: rivers, transportPre: transport };
  const L = level(0);
  await treesOf("trees", Object.fromEntries(["land", "countries", "lakes", "coast", "cb", "rb", "rivers", "areas", "regions", "motorways", "railways", "pipelines"].map((k) => [k, L[k]])));
  for (const k of ["cities", "monuments", "nature", "airports", "events"]) points[k] = pointTree(src[k]);
  buildIndex();

  legend();

  $("stats").textContent = `${o.countries.geometries.length} countries · ${o.regions.geometries.length} states · ${o.lakes.geometries.length} lakes · ` +
    (o.areas ? `${o.areas.geometries.length} areas · ` : "") + `${pts(world).toLocaleString("en")} points` +
    (rivers ? ` · ${new Set(rivers.objects.rivers.geometries.map((g) => g.properties.river)).size} rivers` : "") +
    (cities ? ` · ${cities.features.length} cities` : "") + (monuments ? ` · ${monuments.features.length} monuments` : "") +
    (nature ? ` · ${nature.features.length} peaks, capes…` : "") + (airports ? ` · ${airports.features.length} airports` : "") + (events ? ` · ${events.features.length} historical events` : "");
  const h = new URLSearchParams(location.hash.slice(1));      // (#find=Alps&proj=Mollweide: a link to one thing)
  if (h.get("proj") && PROJ[h.get("proj")]) $("proj").value = h.get("proj");
  // (#groups=[...]: a map of groups; #bio=PA,E345,B7 or #countries=SK,CZ: one list shown -- a range, say)
  if (h.get("groups")) { try { groups = JSON.parse(h.get("groups")); linked = true; } catch (e) { } }
  const list = (s, layerOf) => s.split(",").map((x) => x.trim()).filter(Boolean).map((x) => `${layerOf(x)}:${x}`);
  if (h.get("bio")) { const items = list(h.get("bio"), bioLayerOf); groups.push({ name: "shown", color: GROUP_COLOURS[groups.length % GROUP_COLOURS.length], items }); linked = true;
    if (!h.get("mode")) h.set("mode", "bio"); if (!h.get("level") && items.length) h.set("level", items[0].split(":")[0]); }
  if (h.get("countries")) { groups.push({ name: "shown", color: GROUP_COLOURS[groups.length % GROUP_COLOURS.length], items: list(h.get("countries"), () => "countries") }); linked = true;
    if (!h.get("mode")) h.set("mode", "political"); }
  if (h.get("level") && $("biolevel").querySelector(`[value="${h.get("level")}"]`)) $("biolevel").value = h.get("level");
  if (h.get("date")) setDay(h.get("date"));
  if (h.get("mode") && $("mode").querySelector(`[value="${h.get("mode")}"]`)) { $("mode").value = h.get("mode"); modeChanged(false); }
  renderGroups();
  setup(); draw();
  if (h.get("find")) { const e = search(h.get("find"))[0]; if (e) { $("q").value = e.name; select(e); } else pendingFind = h.get("find"); }
  else if (h.get("at")) {                                      // (#at=lat,lon[,zoom]: what is at that spot)

// a light file read back into the topology the page draws: @arcs (a line each: x y dx dy ...), then each object's CSV
// (a header, a row a geometry -- or, grouped, a row a thing and @name.pieces a row a piece, with what differs)
function parseLite(text) {
  const topo = { type: "Topology", arcs: [], objects: {} }, sections = [];
  let cur = null;
  for (const line of text.split("\n")) {
    if (!line || line[0] === "#") continue;
    if (line.startsWith("grid ")) { const [s, x, y] = line.slice(5).split(" ").map(Number); topo.transform = { scale: [s, s], translate: [x, y] }; continue; }
    if (line[0] === "@") { cur = { head: line.slice(1).split(" "), lines: [] }; sections.push(cur); continue; }
    cur.lines.push(line);
  }
  const value = (v, t) => v === "" ? undefined : t === "#" ? +v : t === "[]" ? v.split("|") : t === "[]#" ? v.split("|").map(Number) : t === "?" ? v === "1" : t === "{}" ? JSON.parse(v) : v;
  const rowsOf = (lines) => {
    const [cols, ...rows] = d3.csvParseRows(lines.join("\n"));
    const spec = cols.map((c) => { const m = c.match(/^(.*?)(\[\]#|\[\]|#|\?|\{\})?$/); return [m[1], m[2] || ""]; });
    return rows.map((r) => { const o = {}; spec.forEach(([k, t], i) => { const v = k === "arcs" ? r[i] : value(r[i], t); if (v !== undefined) o[k] = v; }); return o; });
  };
  const ints = (s) => s.split(" ").filter(Boolean).map(Number);
  const geometry = (kind, s, props) => {
    const g = { properties: props };
    if (!s) g.type = null;
    else if (kind === "polygon") { const p = s.split("|").map((x) => x.split(";").map(ints)); Object.assign(g, p.length === 1 ? { type: "Polygon", arcs: p[0] } : { type: "MultiPolygon", arcs: p }); }
    else { const l = s.split(";").map(ints); Object.assign(g, l.length === 1 ? { type: "LineString", arcs: l[0] } : { type: "MultiLineString", arcs: l }); }
    if (props["~id"] !== undefined) { g.id = props["~id"]; delete props["~id"]; }
    return g;
  };
  const kinds = {}, things = {};
  for (const s of sections) {
    const [name, kind] = s.head;
    if (name === "arcs") { topo.arcs = s.lines.map((l) => { const n = ints(l), a = []; for (let i = 0; i < n.length; i += 2) a.push([n[i], n[i + 1]]); return a; }); continue; }
    if (name.endsWith(".pieces")) {                                 // (each piece: its thing's values, then its own)
      const base = name.slice(0, -7), key = Object.keys(things[base][0] || {})[0], by = new Map(things[base].map((t) => [t[key], t]));
      topo.objects[base] = { type: "GeometryCollection", geometries: rowsOf(s.lines).map((p) => { const { arcs, ...own } = p; return geometry(kinds[base], arcs, { ...by.get(own[key]), ...own }); }) };
      continue;
    }
    kinds[name] = kind;
    const rows = rowsOf(s.lines);
    if (!s.lines[0].split(",").includes("arcs")) { things[name] = rows; continue; }   // (a grouped object's things: the key first)
    topo.objects[name] = { type: "GeometryCollection", geometries: rows.map(({ arcs, ...p }) => geometry(kind, arcs || "", p)) };
  }
  return topo;
}

// a table of points (data/cities.csv, monuments.csv, natural_points.csv, airports.csv, events.csv: a header line, one a line,
// `lon` and `lat` its place) read into one shape, so all of them are drawn, found and named alike
function pointsOf(rows) {
  const NUM = new Set(["population", "visitors", "visitors_year", "wikipedias", "destinations_abroad", "elevation_m", "rank"]);
  return { features: rows.map((r) => {
    const p = {};
    for (const k of rows.columns) if (k !== "lon" && k !== "lat" && r[k] !== "") p[k] = NUM.has(k) ? +r[k] : r[k];
    return { geometry: { coordinates: [+r.lon, +r.lat] }, properties: p };
  }) };
}

// the biogeographic layer (data/lite/bio.txt): after the rest, as it is only for its own map, its names and the
// ecoregion under a click
let pendingFind = null;
const bioLayerOf = (id) => /^E\d+$/.test(id) ? "ecoregions" : /^B\d+$/.test(id) ? "biomes" : "realms";
async function loadBio() {
  const bio = await lineLayer("bio");
  if (!bio) { $("mode").querySelector('[value="bio"]').disabled = true; return; }
  src.bio = bio; src.bioPre = bio; bioLod = [];
  const B = bioLevel(0);
  await treesOf("trees-bio", { realms: B.realms, biomes: B.biomes, ecoregions: B.ecoregions });
  for (const k of ["realms", "biomes", "ecoregions"]) idOf[k] = new Map(B[k].map((f, i) => [f.properties.id, i]));
  const realm = Object.fromEntries(B.realms.map((f) => [f.properties.id, f.properties.name])), biome = Object.fromEntries(B.biomes.map((f) => [f.properties.id, f.properties.name]));
  const count = (k, v) => B.ecoregions.filter((f) => f.properties[k] === v).length;
  B.realms.forEach((f, i) => addToIndex({ cat: "bio", name: f.properties.name, alt: f.properties.id, kind: "biogeographic realm", feats: [f], ids: [i], layer: "realms", mask: "land", at: f.properties.label, weight: 5e9, info: [`${count("realm", f.properties.id)} ecoregions`] }));
  B.biomes.forEach((f, i) => addToIndex({ cat: "bio", name: f.properties.name, alt: f.properties.id, kind: "biome", feats: [f], ids: [i], layer: "biomes", mask: "land", weight: 4e9, info: [`${count("biome", f.properties.id)} ecoregions`] }));
  B.ecoregions.forEach((f, i) => { const p = f.properties;
    addToIndex({ cat: "bio", name: p.name, alt: p.id, kind: `ecoregion · ${realm[p.realm] || "no realm"}`, feats: [f], ids: [i], layer: "ecoregions", mask: "land", at: p.label, weight: 1e6 + (p.area_km2 || 0),
                 info: [biome[p.biome], p.area_km2 ? `${fmt(p.area_km2)} km²` : null, p.id] }); });
  $("stats").textContent += ` · ${B.ecoregions.length} ecoregions in ${B.biomes.length} biomes, ${B.realms.length} realms`;
  legend(); renderGroups();

  if (pendingFind) { const e = search(pendingFind)[0]; if (e) { pendingFind = null; $("q").value = e.name; select(e); } }

// the historical map (data/lite/history.txt): after the rest, as it is only for its own map; each country-period
// is found by name (chosen, the map shows a day in its span), a region under a click
async function loadHistory() {
  const hist = await lineLayer("history");
  if (!hist || !hist.objects.regions) { $("mode").querySelector('[value="history"]').disabled = true; return; }
  src.hist = hist; src.histPre = hist; histLod = []; histNow = null;
  const G = hist.objects.regions.geometries, P = hist.objects.periods.geometries.map((g) => g.properties), byState = new Map(), sides = new Map();
  P.forEach((p, i) => { p._f = dayNum(p.from); p._t = dayNum(p.to); if (!byState.has(p.state)) byState.set(p.state, []); byState.get(p.state).push(i); });
  const held = G.map((g) => { const h = g.properties.held || []; return [h.map((x) => dayNum(x.slice(0, x.lastIndexOf(":")))), h.map((x) => { const s = x.slice(x.lastIndexOf(":") + 1); return s === "" ? -1 : +s; })]; });
  G.forEach((g, r) => { const walk = (x) => { for (const y of x) if (Array.isArray(y)) walk(y); else { const a = y < 0 ? ~y : y; if (!sides.has(a)) sides.set(a, []); sides.get(a).push(r); } }; walk(g.arcs || []); });
  const pairs = [...sides].map(([a, rs]) => [a, rs[0], rs.length > 1 ? rs[1] : -1]);   // (an arc and the regions on its two sides; one: the coast)
  const regions = G.map((g) => topojson.feature(hist, g));
  H0 = { periods: P, byState, held, pairs, regions, lv: [regions.map(keepPolygons)] };
  trees.hregions = tree(regions);
  const name = new Map(P.map((p) => [p.state, p.name]));
  const years = (p) => `${showYear(yearOf(p.from))}–${showYear(yearOf(p.to))}`;
  P.forEach((p, i) => {
    addToIndex({ cat: "history", name: p.name, kind: `${p.status === "independent" || !p.status ? "state" : p.status} ${years(p)}`, feats: [], ids: [], layer: "hperiods", period: i,
                 mask: "land", at: p.label, weight: 1e5 + (p.area_km2 || 0) / 1e3, span: [p.from, p.to],
                 info: [p.owner != null ? `of ${name.get(p.owner) || p.owner}` : null, p.capital ? `capital ${p.capital}` : null, p.area_km2 ? `${fmt(p.area_km2)} km²` : null,
                        p.source === "basemaps" ? `as mapped for ${showYear(yearOf(p.from))}, until the next map` : `${p.from} to ${p.to}`, p.precision === 1 ? "borders approximate" : null] }); });
  $("stats").textContent += ` · ${P.length} country-periods ${showYear(Math.min(...P.map((p) => yearOf(p.from))))}–2019 in ${G.length} regions`;
  if (mode() === "history") draw();
  if (pendingFind) { const r = search(pendingFind), e = r.find(inSpan) || r[0]; if (e) { pendingFind = null; $("q").value = e.name; select(e); } }
}
const inSpan = (e) => e.span && dayNum(e.span[0]) <= dayNum(histDay()) && dayNum(histDay()) <= dayNum(e.span[1]);

// (a name as typed without its marks: "lodz" finds Łódź, "kobenhavn" København -- the accents come off by decomposing, and
//  the letters that do not decompose, Polish ł, Nordic ø and æ, ß, Croatian đ, Turkish ı, are folded by hand)
const FOLD = { "ł": "l", "ø": "o", "đ": "d", "ð": "d", "þ": "th", "æ": "ae", "œ": "oe", "ß": "ss", "ı": "i", "ħ": "h", "ŧ": "t", "ŋ": "n" };
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[łøđðþæœßıħŧŋ]/g, (c) => FOLD[c]);
const collect = (feats) => feats.length === 1 ? feats[0] : { type: "FeatureCollection", features: feats };

const addToIndex = (e) => { e.keys = [...new Set([e.name, ...String(e.alt || "").split(" / ")].filter(Boolean).map(norm))]; index.push(e); };
function buildIndex() {
  const L = level(0), add = addToIndex;
  const countryName = Object.fromEntries(L.countries.map((f) => [f.properties.iso, f.properties.name]));
  L.countries.forEach((f, i) => {
    const p = f.properties;
    if (!f.geometry) return;
    add({ cat: "country", name: p.name, alt: p.name_local, kind: p.subtype === "dependency" ? "dependency" : p.subtype === "continent" ? "continent" : "country",
          feats: [f], ids: [i], layer: "countries", mask: "land", weight: 1e10, info: [p.iso, p.population ? `${fmtPop(p.population)} people` : null, p.density != null ? `${Math.round(p.density)}/km²` : null, p.language, p.sovereign && p.sovereign !== p.iso ? `of ${countryName[p.sovereign] || p.sovereign}` : null] });
  });
  L.regions.forEach((f, i) => {
    const p = f.properties;
    if (!f.geometry) return;
    add({ cat: "region", name: p.name, alt: p.name_local, kind: `state · ${countryName[p.country] || p.country}`, feats: [f], ids: [i], layer: "regions", mask: "land", weight: 1e5, info: [p.iso, p.population ? `${fmtPop(p.population)} people` : null, p.density != null ? `${Math.round(p.density)}/km²` : null, p.language] });   // (below a city of the same name: Istanbul)
  });
  // a lake: its pieces (OSM's separate features) together, by Wikidata item or name
  const lakes = new Map();
  L.lakes.forEach((f, i) => { const p = f.properties; if (!p.name || !f.geometry) return; const k = p.wikidata || p.name; if (!lakes.has(k)) lakes.set(k, []); lakes.get(k).push(i); });
  for (const ids of lakes.values()) {
    const fs = ids.map((i) => L.lakes[i]), p = fs[0].properties, area = Math.max(...fs.map((f) => f.properties.area_km2 || 0));
    add({ cat: "lake", name: p.name, alt: p.name_local, kind: p.type || "lake", feats: fs, ids, layer: "lakes", mask: "water", weight: area * 1e3, info: [`${fmt(area)} km²`] });
  }
  // a river: every line of one river (from where it is first wide to its end), together
  const rv = new Map();
  L.rivers.forEach((f, i) => { const p = f.properties; if (!p.name) return; const k = p.river || p.wikidata || p.name; if (!rv.has(k)) rv.set(k, []); rv.get(k).push(i); });
  for (const ids of rv.values()) {
    const fs = ids.map((i) => L.rivers[i]), p = fs[0].properties, wmax = Math.max(...fs.map((f) => f.properties.width_max_m || 0));
    const km = p.river_km || fs.reduce((n, f) => n + (f.properties.length_km || 0), 0);
    add({ cat: "river", name: p.name, alt: (p.names_local || []).join(" / ") || null, kind: "river", feats: fs, ids, layer: "rivers", weight: km * 1e3, info: [`${fmt(km)} km drawn`, `up to ${fmt(wmax)} m wide`] });
  }
  // the areas: each by its name; the parts of one (North and South Pacific) also together, by their common name
  const byWd = new Map();
  L.areas.forEach((f, i) => {
    const p = f.properties;
    if (!f.geometry) return;
    add({ cat: "area", name: p.name, alt: p.name_en || p.name_local, kind: p.kind, feats: [f], ids: [i], layer: "areas", mask: p.mask, at: p.label, weight: 1e9 / (1 + (p.rank ?? 9)) });
    if (p.wikidata) { if (!byWd.has(p.wikidata)) byWd.set(p.wikidata, []); byWd.get(p.wikidata).push(i); }
  });
  for (const ids of byWd.values()) {
    const fs = ids.map((i) => L.areas[i]), names = new Set(fs.map((f) => f.properties.name));
    if (fs.length < 2 || names.size < 2 || !fs[0].properties.name_en) continue;
    const p = fs[0].properties;
    add({ cat: "area", name: p.name_en, kind: p.kind, feats: fs, ids, layer: "areas", mask: p.mask, weight: 2e9 / (1 + (p.rank ?? 9)) });
  }
  // the main lines: a network by its name or number (a motorway's "A1" is found with its kind)
  for (const layer of ["motorways", "railways", "pipelines"]) {
    const nets = new Map();
    L[layer].forEach((f, i) => { const p = f.properties; if (!p.name && !p.ref) return; if (!nets.has(p.network)) nets.set(p.network, []); nets.get(p.network).push(i); });
    for (const ids of nets.values()) {
      const fs = ids.map((i) => L[layer][i]), p = fs[0].properties;
      const kind = layer === "motorways" ? p.class : layer === "railways" ? (p.highspeed ? "high-speed railway" : "railway") : `${p.substance} pipeline`;
      add({ cat: "line", name: p.name || p.ref, alt: p.ref, kind, feats: fs, ids, layer, weight: (p.network_km || 0) * 10, info: [`${fmt(p.network_km || 0)} km`, p.operator] });
    }
  }
  // (a monument weighs less than a city of its name -- Rabat the city before Rabat the World Heritage Site)
  for (const [set, kindOf, weight, info] of [
    [src.cities, (p) => `${p.capital === "country" ? "capital" : "city"} · ${p.country || "?"}`, (p) => p.population, (p) => [`${fmtPop(p.population)} people`, countryName[p.country]]],
    [src.monuments, (p) => `${p.kind} · ${p.country || "?"}`, (p) => (p.visitors || 0) / 100 + (p.wikipedias || 0) * 1e3, (p) => [p.visitors ? `${fmt(p.visitors)} visitors/yr` : null, p.wikipedias ? `${p.wikipedias} Wikipedias` : null, countryName[p.country]]],
    [src.airports, (p) => `airport · ${p.country || "?"}`, (p) => (p.destinations_abroad || 0) * 1e5, (p) => [[p.iata, p.icao].filter(Boolean).join(" / "), p.city, `${p.destinations_abroad} destinations abroad (2014)`]],
    [src.nature, (p) => p.kind, (p) => (p.elevation_m || 0) * 100, (p) => [p.elevation_m != null && `${fmt(p.elevation_m)} m`]],
    [src.events, (p) => `${p.kind} · ${showDay(p.date)}`, (p) => (p.wikipedias || 0) * 100, (p) => [p.part_of, p.calendar === "julian" ? "Julian calendar" : null, p.place === "location" ? "at the place it happened in" : null, `${p.wikipedias} Wikipedias`]],
  ]) {
    if (!set) continue;
    for (const f of set.features) {
      const p = f.properties;
      add({ cat: "point", name: p.name, alt: p.name_local || p.name_en, kind: kindOf(p), feats: [f], at: f.geometry.coordinates, weight: weight(p), info: info(p),   // (name_en: a peak's or cape's -- Cabo de Hornos, Cape Horn)
            ...(set === src.events ? { span: [p.date, p.date] } : {}) });   // (an event: chosen, the historical map on its day)
    }
  }
}

// TYPING NARROWS: a query that only adds letters to the last one can match nothing the last one did not, so it looks
// only among those (every match, not the 30 shown) -- the first letter scans the ~55,000 names, the rest a handful.
// (The names stay in memory: a scan of them takes milliseconds; IndexedDB would make each one slower, not faster.)
let narrow = { n: null, size: -1, hits: null };
function search(q) {
  const n = norm(q).trim();
  if (!n) return [];
  const pool = narrow.n !== null && n.startsWith(narrow.n) && narrow.size === index.length ? narrow.hits : index;   // (the index grows as bio and history load)
  const out = [], hits = [];
  for (const e of pool) {
    let s = 9;
    for (const k of e.keys) {
      const i = k.indexOf(n);
      if (i < 0) continue;
      s = Math.min(s, k === n ? 0 : i === 0 ? 1 : /[\s\-'(]/.test(k[i - 1]) ? 2 : 3);
    }
    if (s < 9) { out.push([s, -e.weight, e]); hits.push(e); }
  }
  narrow = { n, size: index.length, hits };
  out.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return out.slice(0, 30).map((r) => r[2]);
}

// ---- selecting: highlight, fly there, say what it is ---------------------------------------------------------------
// the selection goes with the panel's x, with the search box emptied (its own x, or Escape in it), or the link cleared
function clearSel() {
  sel = null; $("info").style.display = "none"; $("q").value = ""; found = []; showResults();
  history.replaceState(null, "", location.pathname + location.search); draw();
}
function select(e) {
  if (e.span) {                                                     // (a country-period: on the historical map, on a day of its span)
    if (mode() !== "history") { $("mode").value = "history"; modeChanged(false); }
    if (!inSpan(e)) setDay(e.span[0]);
    if (e.period != null) { e.feats = histFeature(e.period); if (!e.feats.length) e.feats = [{ type: "Feature", geometry: { type: "Point", coordinates: e.at } }]; }
  }
  sel = { ...e, geom: collect(e.feats), at: e.at || d3.geoCentroid(collect(e.feats)) };
  const info = $("info");
  info.style.display = "block";
  info.innerHTML = "";
  const close = Object.assign(document.createElement("button"), { textContent: "×", title: "Clear the selection" });
  close.onclick = clearSel;
  const h = Object.assign(document.createElement("h2"), { textContent: e.name });
  const k = Object.assign(document.createElement("div"), { className: "kind", textContent: [e.kind, ...(e.info || [])].filter(Boolean).join(" · ") });
  info.append(close, h, k);
  if (e.alt && norm(e.alt) !== norm(e.name)) info.append(Object.assign(document.createElement("div"), { className: "kind", textContent: e.alt }));
  history.replaceState(null, "", "#find=" + encodeURIComponent(e.name) + ($("proj").selectedIndex ? "&proj=" + encodeURIComponent($("proj").value) : "") + (e.span ? "&date=" + encodeURIComponent(histDay()) : ""));
  fly(sel);
}

function fly(s) {
  let span = 0;
  if (s.cat !== "point") {
    const [[w, so], [ea, n]] = d3.geoBounds(s.geom);
    const dlon = ((ea - w) + 360) % 360 || 360;
    span = Math.max(n - so, dlon * Math.cos(((n + so) / 2) * Math.PI / 180));
  }
  const toZoom = s.cat === "point" ? Math.max(zoom, 6) : Math.max(1, Math.min(MAX_ZOOM, 110 / Math.max(span, 0.5)));
  const toRot = [-s.at[0], Math.max(-80, Math.min(80, -s.at[1])), 0];
  const r0 = rotate.slice(), z0 = zoom, t0 = performance.now(), T = 700;
  const d = ((toRot[0] - r0[0] + 540) % 360) - 180;                  // (the short way round)
  const step = (t) => {
    const k = Math.min(1, (t - t0) / T), e = d3.easeCubicInOut(k);
    rotate = [r0[0] + d * e, r0[1] + (toRot[1] - r0[1]) * e, 0];
    zoom = Math.exp(Math.log(z0) + (Math.log(toZoom) - Math.log(z0)) * e);
    setup(); draw(k < 1);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---- what is here (a click) ----------------------------------------------------------------------------------------
function identify(e) {
  const ll = proj.invert([e.clientX, e.clientY]);
  if (!ll || !isFinite(ll[0]) || !visible(ll)) return;
  identifyAt(ll, [e.clientX, e.clientY]);
}

function identifyAt(ll, px) {
  const at = [[ll[0], ll[1], ll[0], ll[1]]];
  const byLayer = (layer) => { const ids = new Set(query(trees[layer], at)); return index.filter((x) => x.layer === layer && x.ids.some((i) => ids.has(i))); };
  const inside = (x) => x.feats.some((f) => f.geometry && d3.geoContains(f, ll));
  const hits = [];
  const country = byLayer("countries").find(inside), region = byLayer("regions").find(inside), lake = byLayer("lakes").find(inside);
  const onLand = !!country && !lake;
  for (const x of [country, region, lake]) if (x) hits.push(x);
  if (src.bio && !lake) for (const l of ["ecoregions", "biomes", "realms"]) { const x = byLayer(l).find(inside); if (x) hits.push(x); }
  if (src.hist && mode() === "history" && !lake) {                // (the region here, and its state that day)
    const r = query(trees.hregions, at).find((r) => d3.geoContains(H0.regions[r], ll));
    if (r != null) {
      const p = H0.regions[r].properties, pi = histOn().of[r], name = (s) => { const i = H0.byState.get(s); return i ? H0.periods[i[0]].name : "nobody"; };
      const owners = (p.held || []).map((x) => { const k = x.lastIndexOf(":"), s = x.slice(k + 1); return `${s === "" ? "nobody" : name(+s)} from ${showDay(x.slice(0, k))}`; });
      hits.unshift({ cat: "history", name: p.name || `region ${p.id}`, kind: "historical region", feats: [H0.regions[r]], at: p.label,
                     info: [p.admin, p.country, p.area_km2 ? `${fmt(p.area_km2)} km²` : null, owners.length > 12 ? `${owners.length} owners, the last: ${owners.slice(-12).join(", ")}` : owners.join(", ")] });
      const x = pi >= 0 && index.find((x) => x.period === pi);
      if (x) hits.unshift(x);
    }
  }
  const areas = byLayer("areas").filter((x) => x.feats.length === 1 && inside(x));
  areas.sort((a, b) => a.weight - b.weight);                        // (the smallest first: a gulf before its ocean)
  hits.push(...areas);
  // rivers passing within 8 pixels

  return i == null ? null : (layer === "countries" ? level(0).countries : src.bio ? bioLevel(0)[layer] : [])[i]; };

// ---- THE GAME (the button top right): cities of the world, a continent or a country --------------------------------
// "people": name cities -- their people add up, as a share of all the people there. "outside" / "inside": each city
// named gets a circle (so many km across); the next must lie outside every circle / inside one. "place": the game names
// a city, a click says where it is -- a circle round the city out to the click, so many km off (0 is best).
// While the game panel is open the map has no names but the cities named, and no points but theirs; a start begins
// it all afresh.
const game = { open: false, style: "people", where: null, km: 500, named: [], finds: [], ask: null, pool: [], rounds: 10,

let gameData = null;                                                // (cities by name, each one's continent; built once)
function gameIndex() {

  const L = level(0), key = (s) => norm(s).replace(/[^\p{L}\p{N}]+/gu, " ").trim();

  const byName = new Map(), cont = [];

  for (const f of L.countries) {

    if (!all) { people[p.continent] = (people[p.continent] || 0) + p.population; continue; }
    for (const r of rs) people[r.properties.continent] = (people[r.properties.continent] || 0) + p.population * r.properties.population / all;
  }

  box.innerHTML = "";

    const O = src.world.objects, split = new Set(O.regions.geometries.map((g) => g.properties.country));

function startGame() {

const say = (text, no = false) => { $("g-msg").textContent = text; $("g-msg").className = no ? "no" : ""; };

const takeSnap = () => { snap.width = canvas.width; snap.height = canvas.height; snap.getContext("2d").drawImage(canvas, 0, 0); snapZoom = zoom; };

// ZOOM (the wheel and a pinch alike): the last picture scaled about the centre -- the projection zooms about it too
function zoomTo(z) {
  if (snapZoom === null) takeSnap();                            // (the picture as it is, to scale)
  zoom = Math.max(0.5, Math.min(MAX_ZOOM, z));
  setup();
  const k = zoom / snapZoom, cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(k, 0, 0, k, cx - k * cx, cy - k * cy); ctx.drawImage(snap, 0, 0);
  ctx.restore();
  later();
}
// THE POINTERS DOWN (a mouse, a pen, each finger): one drags the globe round, two pinch -- the zoom follows the distance
// between them from where the pinch began; lifting one ends the pinch without a click
const fingers = new Map();
let pinch = null;   // [the distance between the two at the start, the zoom then]
const spread = () => { const [a, b] = [...fingers.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
canvas.addEventListener("pointerdown", (e) => {
  fingers.set(e.pointerId, [e.clientX, e.clientY]); canvas.setPointerCapture(e.pointerId);
  if (fingers.size === 2) { drag = null; moved = 99; pinch = [Math.max(spread(), 1), zoom]; return; }   // (a second finger: a pinch, never a click)
  if (fingers.size > 2) return;
  drag = [e.clientX, e.clientY, ...rotate]; last = null; moved = 0; canvas.classList.add("dragging"); takeSnap();
});
canvas.addEventListener("pointermove", (e) => {
  if (fingers.has(e.pointerId)) fingers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && fingers.size === 2) return zoomTo(pinch[1] * spread() / pinch[0]);
  if (!drag) return e.pointerType === "mouse" ? tip(e) : undefined;
  moved = Math.max(moved, Math.hypot(e.clientX - drag[0], e.clientY - drag[1]));
  if (moved < (e.pointerType === "mouse" ? 3 : 8)) return;    // (a finger wobbles more than a mouse on a tap)
  const k = 150 / proj.scale();
  rotate = [drag[2] + (e.clientX - drag[0]) * k * 0.6, Math.max(-90, Math.min(90, drag[3] - (e.clientY - drag[1]) * k * 0.6)), 0];
  proj.rotate(rotate); last = [e.clientX, e.clientY];
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(snap, (e.clientX - drag[0]) * dpr, (e.clientY - drag[1]) * dpr);
  ctx.restore();
  later();
});
const lift = (e, cancelled) => {
  fingers.delete(e.pointerId);
  if (pinch) { if (!fingers.size) { pinch = null; drag = null; canvas.classList.remove("dragging"); clearTimeout(idle); snapZoom = null; draw(); } return; }
  const click = !cancelled && drag && moved < (e.pointerType === "mouse" ? 3 : 8);
  drag = null; canvas.classList.remove("dragging"); clearTimeout(idle);
  if (click && src) { if (game.open) gameClick(e); else if ($("grouping").checked) groupClick(e); else identify(e); } else { snapZoom = null; draw(); }
};
canvas.addEventListener("pointerup", (e) => lift(e, false));
canvas.addEventListener("pointercancel", (e) => lift(e, true));
canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoomTo(zoom * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
function tip(e) {
  const t = $("tip");
  if (!src || game.open) return;                                  // (the game: no names to go by)
  const ll = proj.invert([e.clientX, e.clientY]);
  if (!ll || !isFinite(ll[0])) { t.style.display = "none"; return; }
  const r = 8 * pxKm() / 111, c = Math.max(0.1, Math.cos(ll[1] * Math.PI / 180)), box = [[ll[0] - r / c, ll[1] - r, ll[0] + r / c, ll[1] + r]];
  const best = [];
  for (const [layer, label] of [
    ["cities", (p) => `${p.name}${p.name_local ? " (" + p.name_local + ")" : ""} · ${fmtPop(p.population)}`],
    ["monuments", (p) => `${p.name} · ${p.kind}` + (p.visitors ? ` · ${fmt(p.visitors)} visitors/yr` : p.wikipedias ? ` · ${p.wikipedias} Wikipedias` : "")],
    ["airports", (p) => `${p.name} (${p.iata}) · ${p.destinations_abroad} destinations abroad`],
    ["nature", (p) => `${p.name} · ${p.kind}${p.elevation_m != null ? " · " + fmt(p.elevation_m) + " m" : ""}`],
    ["events", (p) => `${p.name} · ${p.kind} · ${showDay(p.date)}`],
  ]) {
    if (!src[layer] || !on(layer) || (layer === "events" && !(mode() === "history" && src.hist))) continue;
    for (const i of query(points[layer], box)) {
      const f = src[layer].features[i], p = f.properties;
      if (!visible(f.geometry.coordinates)) continue;
      if ((layer === "cities" && p.population < minPop()) || (layer === "monuments" && i >= 60 * zoom * zoom) ||
          (layer === "airports" && (p.destinations_abroad || 0) < 80 / (zoom * zoom)) ||
          (layer === "events" && !(histOn().events.get(i) < EVENTS * zoom * zoom))) continue;   // (only what is drawn)
      const [x, y] = proj(f.geometry.coordinates), d = Math.hypot(x - e.clientX, y - e.clientY);
      if (d < 7) best.push([d, label(f.properties)]);
    }
  }
  best.sort((a, b) => a[0] - b[0]);
  if (!best.length) { t.style.display = "none"; return; }
  t.textContent = best[0][1]; t.style.display = "block"; t.style.left = e.clientX + 12 + "px"; t.style.top = e.clientY + 12 + "px";
}
$("proj").onchange = () => { setup(); draw(); };
function modeChanged(redraw = true) {
  $("palette").disabled = mode() !== "political" && mode() !== "history";
  $("biolevel").hidden = mode() !== "bio";
  $("histbox").hidden = mode() !== "history";
  legend(); renderGroups();
  if (redraw) draw();
}
$("mode").onchange = () => { try { localStorage.mode = $("mode").value; } catch (e) { } modeChanged(); };
$("biolevel").onchange = () => { try { localStorage.biolevel = bioLayer(); } catch (e) { } legend(); renderGroups(); draw(); };
try { if ($("biolevel").querySelector(`[value="${localStorage.biolevel}"]`)) $("biolevel").value = localStorage.biolevel; } catch (e) { }
try { setDay(localStorage.histday || "1914-06-28"); } catch (e) { setDay("1914-06-28"); }
$("year").oninput = () => { setDay(yearText(+$("year").value) + histDay().replace(/^-?\d+/, "")); draw(); };
$("day").onchange = () => { setDay($("day").value); $("day").value = showDay(histDay()); draw(); };
modeChanged(false);
$("palette").onchange = () => { try { localStorage.palette = $("palette").value; } catch (e) { } draw(); };
for (const c of document.querySelectorAll("[data-layer]")) c.onchange = () => draw();
addEventListener("resize", () => { setup(); draw(); });
load();
</script>
