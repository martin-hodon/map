[package]
name = "mapgeo"
version = "0.1.0"
edition = "2021"
description = "The map's geometry core: d3-geo's projection pipeline (rotate, clip, resample, project), the rows' tracing into canvas commands, the R-trees and the light-file parser -- compiled to WebAssembly (js/mapgeo.wasm) and used by default, js/ the fallback"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "check"
path = "src/bin/check.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
